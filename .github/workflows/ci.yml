name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly live API smoke on Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DnsCheck.slnx

      - name: Verify formatting
        run: dotnet format DnsCheck.slnx --no-restore --verify-no-changes --verbosity minimal

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Clean, restore, build, and test
        run: |
          dotnet clean DnsCheck.slnx
          dotnet restore DnsCheck.slnx
          dotnet build DnsCheck.slnx --no-restore --configuration Release -warnaserror
          dotnet test DnsCheck.slnx --no-build --configuration Release --report-trx --results-directory TestResults

      - name: MonitorConsole smoke (--run-all, public example group)
        run: dotnet run --project samples/MonitorConsole --configuration Release --no-build -- --run-all

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx

  console-smoke:
    name: Console Sample Smoke
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve smoke policy
        id: policy
        env:
          API_KEY: ${{ secrets.DNSCHECK_API_KEY }}
        run: |
          if [[ -n "$API_KEY" ]]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${{ github.event_name }}" in
            push|schedule|workflow_dispatch)
              if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                echo "mode=required" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac

          echo "mode=skip" >> "$GITHUB_OUTPUT"

      - name: Require API key on main
        if: steps.policy.outputs.mode == 'required'
        run: |
          echo "::error::DNSCHECK_API_KEY is not configured. See docs/contributing/ci-live-smoke.md"
          exit 1

      - name: Skip authenticated smoke
        if: steps.policy.outputs.mode == 'skip'
        run: |
          echo "Skipping authenticated console smoke - DNSCHECK_API_KEY not configured"

      - name: Run MonitorConsole (--run-all, authenticated)
        if: steps.policy.outputs.mode == 'run'
        env:
          DNSCHECK_API_KEY: ${{ secrets.DNSCHECK_API_KEY }}
        run: dotnet run --project samples/MonitorConsole --configuration Release -- --run-all
